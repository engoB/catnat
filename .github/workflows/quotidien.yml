name: Collecte quotidienne et publication

on:
  schedule:
    - cron: "20 5 * * *"      # tous les jours à 05h20 UTC (07h20 heure de Paris en été)
  workflow_dispatch:           # bouton « Run workflow » pour déclencher à la main
  push:
    branches: [main]

permissions:
  contents: write              # pour committer data/
  pages: write                 # pour publier
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter, détecter, générer
        run: python scripts/catnat.py build

      - name: Journaliser dans le dépôt
        run: |
          git config user.name  "catnat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Aucun changement de données."
          else
            git commit -m "données du $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
